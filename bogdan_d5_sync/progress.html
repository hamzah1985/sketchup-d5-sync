<!doctype html><html><head><meta charset="utf-8"><style>
body{font:13px system-ui,sans-serif;margin:16px;color:#273642;background:#f7f7f7}.stage{display:flex;gap:12px;align-items:center;min-height:46px}#spinner{width:20px;height:20px;flex-shrink:0;border:3px solid #dce3e7;border-top-color:#357ca1;border-radius:50%;animation:turn 1s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}small{display:block;margin:9px 0;color:#59656d}button{float:right;border:1px solid #abb5bc;padding:5px 10px;border-radius:4px;background:white;color:inherit}#elapsed{font-variant-numeric:tabular-nums}
</style></head><body><div class="stage" role="status" aria-live="polite"><span id="spinner" aria-hidden="true"></span><span id="message">Connecting to D5…</span></div><small id="elapsed"></small><small>Closing this window keeps sync running.</small><button onclick="sketchup.disconnect()">Disconnect</button><script>
var started=Date.now();var busy=true;function setStage(message){document.getElementById('message').textContent=message;busy=!/sent|Disconnected|failed|Connected to D5/i.test(message);document.getElementById('spinner').style.animationPlayState=busy?'running':'paused';document.getElementById('spinner').style.borderTopColor=busy?'#357ca1':'#32905d';}setInterval(function(){document.getElementById('elapsed').textContent=busy?'Elapsed: '+Math.floor((Date.now()-started)/1000)+' seconds':'';},1000);window.onload=function(){sketchup.ready();};
</script></body></html>
